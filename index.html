```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I love you &lt;3</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Экран запуска (нужен, так как браузеры блокируют автозапуск музыки без клика) */
        #start-screen {
            position: absolute;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            width: 100%;
            height: 100%;
            transition: opacity 1s ease-out;
        }

        #start-btn {
            padding: 15px 40px;
            font-size: 24px;
            color: #fff;
            background: linear-gradient(45deg, #4682B4, #1E90FF);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(30, 144, 255, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(30, 144, 255, 0.8);
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <button id="start-btn">Нажми меня ❤️</button>
    </div>

    <canvas id="canvas"></canvas>
    
    <!-- Подключаем твою песню -->
    <audio id="bgm" src="love_you.mp3" loop></audio>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const bgm = document.getElementById('bgm');

        let width, height, cx, cy;
        let scale = 15; // Масштаб сердца (адаптируем под экран позже)
        
        const WORDS = ["love you", "Love You", "LOVE YOU"];
        const CENTER_TEXT = " Love You ";
        const COLORS = [
            'rgb(70, 130, 180)',
            'rgb(30, 144, 255)',  
            'rgb(0, 191, 255)',  
            'rgb(100, 149, 237)', 
            'rgb(65, 105, 225)'
        ];

        let particles = [];
        let frame = 0;
        let isRunning = false;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            cx = width / 2;
            cy = height / 2;
            // Адаптируем размер сердца под мобильные устройства
            scale = Math.min(width, height) / 40; 
        }
        window.addEventListener('resize', resize);
        resize();

        function heartX(t) {
            return 16 * Math.pow(Math.sin(t), 3);
        }

        function heartY(t) {
            return -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        }

        class Particle {
            constructor(x, y, order, kind) {
                this.x = x;
                this.y = y;
                this.order = order;
                this.kind = kind;
                this.word = WORDS[Math.floor(Math.random() * WORDS.length)];
                this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
                this.alpha = 0;
                this.flicker = Math.random() * Math.PI * 2;
                this.delay = 0;
                this.sizeMult = 0.85 + Math.random() * 0.3; // 0.85 до 1.15
            }
        }

        function buildParticles() {
            particles = [];
            let placedOutline = [];
            let n_outline = 150;
            let min_gap_outline = 25;

            // Контур
            for (let i = 0; i < n_outline; i++) {
                let t = (i / n_outline) * 2 * Math.PI;
                let bx = heartX(t);
                let by = heartY(t);
                let sx = bx * scale + cx;
                let sy = by * scale + cy;

                let tooClose = placedOutline.some(p => Math.hypot(sx - p.x, sy - p.y) < min_gap_outline);
                if (!tooClose) {
                    placedOutline.push({x: sx, y: sy});
                    particles.push(new Particle(sx, sy, i, "outline"));
                }
            }

            let outline_span = particles.length > 0 ? Math.max(...particles.map(p => p.order)) : 0;
            let frames_per_step = 1.6;
            let fill_start_frame = Math.floor(outline_span * frames_per_step) + 30;

            // Заливка
            let placedFill = [];
            let n_fill = 100;
            let min_gap_fill = 35;
            let attempts = 0;

            while (placedFill.length < n_fill && attempts < n_fill * 80) {
                attempts++;
                let t = Math.random() * 2 * Math.PI;
                let r = Math.random() * 0.86;
                let bx = heartX(t) * r;
                let by = heartY(t) * r;
                let sx = bx * scale + cx;
                let sy = by * scale + cy;

                let tooClose = placedFill.some(p => Math.hypot(sx - p.x, sy - p.y) < min_gap_fill);
                if (!tooClose) {
                    placedFill.push({x: sx, y: sy});
                    let p = new Particle(sx, sy, Math.floor(Math.random() * 320), "fill");
                    p.delay = fill_start_frame + p.order;
                    particles.push(p);
                }
            }

            // Устанавливаем задержку для контура
            particles.forEach(p => {
                if (p.kind === "outline") {
                    p.delay = Math.floor(p.order * frames_per_step);
                }
            });
        }

        function drawGlowText(word, color, x, y, alpha, sizeMult, isCenter = false) {
            if (alpha <= 0) return;

            ctx.save();
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            
            if (isCenter) {
                ctx.font = `bold ${Math.floor(54 * sizeMult)}px Georgia`;
            } else {
                let baseSize = 14 * sizeMult;
                ctx.font = `bold ${Math.floor(baseSize)}px Arial`;
            }

            // Настройка свечения (Glow)
            ctx.shadowColor = color;
            ctx.shadowBlur = isCenter ? 30 : 15;
            
            // Полупрозрачность
            ctx.globalAlpha = alpha / 255;
            
            // Цвет текста
            ctx.fillStyle = isCenter ? "rgb(255, 250, 245)" : color;
            
            // Рисуем текст несколько раз для усиления эффекта свечения
            ctx.fillText(word, x, y);
            if (alpha > 100) {
                ctx.fillText(word, x, y);
            }

            ctx.restore();
        }

        function animate() {
            if (!isRunning) return;

            // Очищаем экран с небольшим следом для плавности
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, width, height);

            frame++;
            
            // Рисуем частицы
            particles.forEach(p => {
                if (frame > p.delay && p.alpha < 255) {
                    p.alpha = Math.min(255, p.alpha + 14 + Math.floor(Math.random() * 4));
                }

                if (p.alpha > 0) {
                    let flick = p.alpha >= 255 ? 0.75 + 0.25 * Math.sin(frame * 0.04 + p.flicker) : 1.0;
                    let currentAlpha = p.alpha * flick;
                    drawGlowText(p.word, p.color, p.x, p.y, currentAlpha, p.sizeMult);
                }
            });

            // Рисуем центральный текст
            let outline_span = particles.filter(p=>p.kind==="outline").length;
            let fill_start_frame = Math.floor(outline_span * 1.6) + 30;
            let center_start = fill_start_frame + 200;

            if (frame > center_start) {
                let progress = Math.min(1.0, (frame - center_start) / 60);
                let center_alpha = 255 * (1 - Math.exp(-progress * 8));
                let pulse = 1.0 + 0.025 * Math.sin(frame * 0.05);
                
                // Адаптируем размер центрального текста под экраны телефонов
                let mobilePulse = pulse * (width < 600 ? 0.6 : 1.0); 

                drawGlowText(CENTER_TEXT, "rgba(255, 255, 255, 1)", cx, cy, center_alpha, mobilePulse, true);
            }

            requestAnimationFrame(animate);
        }

        startBtn.addEventListener('click', () => {
            // Пытаемся включить музыку
            bgm.play().catch(e => console.log("Браузер заблокировал автозапуск аудио", e));
            
            startScreen.style.opacity = '0';
            setTimeout(() => {
                startScreen.style.display = 'none';
                buildParticles();
                isRunning = true;
                animate();
            }, 500);
        });

    </script>
</body>
</html>
